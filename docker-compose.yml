services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: avendia
      POSTGRES_USER: avendia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avendia -d avendia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - avendia_postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://avendia:${POSTGRES_PASSWORD:-change_me}@db:5432/avendia
      DATABASE_SSL_REQUIRED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/ready"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  avendia_postgres:
