services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: avendia
      POSTGRES_USER: avendia
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avendia -d avendia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - avendia_postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  avendia_postgres:

