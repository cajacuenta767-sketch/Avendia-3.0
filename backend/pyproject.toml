[project]
name = "avendia-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "bcrypt>=4.2",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "olefile>=0.47",
  "pypdf>=5.1",
  "reportlab>=4.2",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.34",
  "vercel>=0.5",
  "xlrd>=2.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "xlwt>=1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
